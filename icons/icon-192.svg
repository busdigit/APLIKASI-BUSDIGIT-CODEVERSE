<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="url(#neonGrad)" stroke-width="3" opacity="0.85"/>
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="#00FFA3" stroke-width="1" opacity="0.3"/>

  <!-- Radial Glow Behind Logo -->
  <circle cx="96" cy="96" r="60" fill="url(#glowGlow)" filter="url(#glow)" opacity="0.4"/>

  <!-- Logo Graphics: Terminal / Diamond / Monogram 'Bd' -->
  <g transform="translate(36, 36) scale(0.625)">
    <!-- Circuit Glow Accents -->
    <path d="M 12 96 L 40 96 M 152 96 L 180 96" stroke="#00FFA3" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <circle cx="12" cy="96" r="5" fill="#00FFA3"/>
    <circle cx="180" cy="96" r="5" fill="#00FFA3"/>

    <!-- Left B Bracket -->
    <path d="M 50 40 L 90 40 C 115 40 130 52 130 72 C 130 86 120 95 106 98 C 124 102 136 113 136 130 C 136 152 118 164 90 164 L 50 164 Z" 
          fill="none" stroke="url(#neonGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Inner B Holes -->
    <path d="M 74 66 L 90 66 C 100 66 106 70 106 78 C 106 86 100 90 90 90 L 74 90 Z" fill="#06b6d4" opacity="0.9"/>
    <path d="M 74 112 L 92 112 C 104 112 110 118 110 126 C 110 136 104 140 92 140 L 74 140 Z" fill="#00FFA3" opacity="0.9"/>

    <!-- Code Spark Diamond -->
    <polygon points="152,42 162,56 152,70 142,56" fill="#00FFA3"/>
    <polygon points="152,126 162,140 152,154 142,140" fill="#38bdf8"/>
  </g>

  <!-- Brand Sub-Text -->
  <text x="96" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#00FFA3" letter-spacing="3" text-anchor="middle">CODEVERSE</text>
</svg>
