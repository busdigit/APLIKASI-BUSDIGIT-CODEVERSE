<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <linearGradient id="neonGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGlow512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  
  <!-- Outer Glow Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#neonGrad512)" stroke-width="8" opacity="0.85"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#00FFA3" stroke-width="2" opacity="0.3"/>

  <!-- Radial Glow Behind Logo -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGlow512)" filter="url(#glow512)" opacity="0.4"/>

  <!-- Logo Graphics: Terminal / Monogram 'Bd' -->
  <g transform="translate(96, 70) scale(1.65)">
    <!-- Circuit Glow Accents -->
    <path d="M 12 96 L 40 96 M 152 96 L 180 96" stroke="#00FFA3" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <circle cx="12" cy="96" r="5" fill="#00FFA3"/>
    <circle cx="180" cy="96" r="5" fill="#00FFA3"/>

    <!-- Left B Bracket -->
    <path d="M 50 40 L 90 40 C 115 40 130 52 130 72 C 130 86 120 95 106 98 C 124 102 136 113 136 130 C 136 152 118 164 90 164 L 50 164 Z" 
          fill="none" stroke="url(#neonGrad512)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow512)"/>
    
    <!-- Inner B Holes -->
    <path d="M 74 66 L 90 66 C 100 66 106 70 106 78 C 106 86 100 90 90 90 L 74 90 Z" fill="#06b6d4" opacity="0.9"/>
    <path d="M 74 112 L 92 112 C 104 112 110 118 110 126 C 110 136 104 140 92 140 L 74 140 Z" fill="#00FFA3" opacity="0.9"/>

    <!-- Code Spark Diamond -->
    <polygon points="152,42 162,56 152,70 142,56" fill="#00FFA3"/>
    <polygon points="152,126 162,140 152,154 142,140" fill="#38bdf8"/>
  </g>

  <!-- Brand Sub-Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#00FFA3" letter-spacing="8" text-anchor="middle">CODEVERSE</text>
</svg>
